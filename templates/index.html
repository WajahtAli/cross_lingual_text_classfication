<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crosslingual Domain Prediction</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 500px;
      text-align: center;
      transition: transform 0.2s;
    }

    .container:hover {
      transform: translateY(-2px);
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
      font-weight: 600;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      color: #555;
      font-size: 0.95em;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      resize: vertical;
      transition: all 0.3s;
    }

    textarea:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 6px rgba(76,175,80,0.4);
      outline: none;
    }

    input[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4CAF50, #388E3C);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.05em;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    input[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .result {
      margin-top: 22px;
      padding: 14px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: 500;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Crosslingual Text Domain Prediction</h2>
    <form method="POST">
      <label for="user_text">Enter your text:</label>
      <textarea id="user_text" name="user_text">{{ user_text }}</textarea>
      <input type="submit" value="Predict Domain">
    </form>

    {% if prediction %}
      <div class="result">
        Predicted Domain: {{ prediction }}
      </div>
    {% endif %}
  </div>
</body>
</html>
